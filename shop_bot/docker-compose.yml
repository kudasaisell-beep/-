version: "3.8"

services:
  bot:
    build: .
    container_name: shop_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./shop.db:/app/shop.db
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - botnet

  redis:
    image: redis:7-alpine
    container_name: shop_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - botnet

volumes:
  redis_data:

networks:
  botnet:
    driver: bridge
